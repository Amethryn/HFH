<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Club Haikyuu - Classement</title>
<style>
    body{
        font-family: Arial, sans-serif;
        background:#1f1f1f;
        color:white;
        margin:0;
        padding:20px;
    }
    h1{
        text-align:center;
        color:#f7d25a; /* Jaune Bokuto */
    }
    .admin-section{
        background:#2a2a2a;
        padding:15px;
        margin-bottom:20px;
        border-radius:10px;
        display:none;
    }
    input, button{
        padding:8px;
        margin:5px 0;
        border:none;
        border-radius:5px;
    }
    button{
        cursor:pointer;
        background:#f7d25a;
        font-weight:bold;
    }
    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }
    th, td{
        border-bottom:1px solid #444;
        padding:10px;
        text-align:left;
    }
    .delete-btn{
        background:#e74c3c;
        color:white;
    }
    .edit-btn{
        background:#3498db;
        color:white;
    }
</style>
</head>
<body>

<h1>Classement du Club Haikyuu</h1>

<div id="adminLogin">
    <h3>Connexion Administrateur</h3>
    <input type="password" id="adminPass" placeholder="Mot de passe admin">
    <button onclick="checkAdmin()">Entrer</button>
</div>

<div id="adminPanel" class="admin-section">
    <h3>Panneau Administrateur</h3>
    <input type="text" id="nameInput" placeholder="Nom">
    <input type="number" id="pointsInput" placeholder="Points">
    <button onclick="addMember()">Ajouter</button>
</div>

<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Points</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="membersTable"></tbody>
</table>

<script>
let ADMIN_PASSWORD = "bokutoPower";

function checkAdmin(){
    let input = document.getElementById("adminPass").value;
    if(input === ADMIN_PASSWORD){
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminLogin").style.display = "none";
    } else {
        alert("Mot de passe incorrect");
    }
}

function loadMembers(){
    let data = localStorage.getItem("members");
    return data ? JSON.parse(data) : [];
}

function saveMembers(list){
    localStorage.setItem("members", JSON.stringify(list));
}

function renderTable(){
    let list = loadMembers();
    let table = document.getElementById("membersTable");
    table.innerHTML = "";

    list.sort((a,b)=>b.points - a.points);

    list.forEach((m,i)=>{
        table.innerHTML += `
            <tr>
                <td>${m.name}</td>
                <td>${m.points}</td>
                <td>
                    <button class="edit-btn" onclick="editPoints(${i})">Modifier</button>
                    <button class="delete-btn" onclick="deleteMember(${i})">Supprimer</button>
                </td>
            </tr>`;
    });
}

function addMember(){
    let name = document.getElementById("nameInput").value;
    let points = Number(document.getElementById("pointsInput").value);
    if(!name) return alert("Nom requis");

    let list = loadMembers();
    list.push({name, points});
    saveMembers(list);
    renderTable();
}

function deleteMember(i){
    let list = loadMembers();
    list.splice(i,1);
    saveMembers(list);
    renderTable();
}

function editPoints(i){
    let list = loadMembers();
    let newPts = prompt("Nouveaux points pour " + list[i].name, list[i].points);
    if(newPts === null) return;
    list[i].points = Number(newPts);
    saveMembers(list);
    renderTable();
}

// Reset automatique du lundi 6h
function weeklyReset(){
    let now = new Date();
    let lastReset = localStorage.getItem("lastReset");

    if(lastReset){ lastReset = new Date(lastReset); }

    let isMonday6AM = now.getDay() === 1 && now.getHours() === 6;

    if(isMonday6AM){
        let list = loadMembers();
        list = list.map(m=>({name:m.name, points:0}));
        saveMembers(list);
        localStorage.setItem("lastReset", now);
        renderTable();
    }
}

setInterval(weeklyReset, 60000);
renderTable();
</script>

</body>
</html>
