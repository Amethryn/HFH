<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement Club Haikyuu</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #1f1f1f;
    color: #fff;
    margin: 0;
    padding: 20px;
}
h1 {
    color: #f7d25a;
    text-align: center;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #444;
    padding: 10px;
    text-align: center;
}
th {
    background-color: #f7d25a;
    color: #1f1f1f;
}
tr:nth-child(even) {
    background-color: #2a2a2a;
}
button {
    padding: 5px 10px;
    margin: 2px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button.modify { background-color: #4da6ff; color: #fff; }
button.delete { background-color: #ff4d4d; color: #fff; }
#admin-section { display: none; margin-top: 20px; text-align: center; }
#admin-add { display: none; margin-top: 20px; text-align: center; }
input[type="text"], input[type="number"], input[type="password"] {
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #444;
    margin-right: 5px;
}
</style>
</head>
<body>

<h1>Classement Club Haikyuu</h1>

<!-- Login Admin -->
<div id="admin-login">
    <label>Mot de passe Admin : </label>
    <input type="password" id="admin-pass">
    <button onclick="checkAdmin()">Se connecter</button>
</div>

<div id="admin-section">
    <p>Bienvenue, Admin !</p>
</div>

<!-- Formulaire pour ajouter un joueur -->
<div id="admin-add">
    <h3>Ajouter un joueur</h3>
    <input type="text" id="new-nom" placeholder="Nom">
    <input type="number" id="new-points" placeholder="Points">
    <button onclick="ajouterJoueur()">Ajouter</button>
</div>

<!-- Tableau -->
<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Points</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="table-body">
        <!-- Rempli automatiquement depuis Google Sheets -->
    </tbody>
</table>

<script>
// === CONFIGURATION ===
const ADMIN_PASS = "bokutoPower"; // Mot de passe admin
let isAdmin = false;

// URL de ton Google Apps Script
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXPf1aGvNaFiVclrNLFB3zg5tZn7316GoSb9ZLvTvaWuNX46WpVn5-mAwz3gNpugV0/exec";

// Connexion Admin
function checkAdmin() {
    const pass = document.getElementById('admin-pass').value;
    if(pass === ADMIN_PASS){
        isAdmin = true;
        document.getElementById('admin-section').style.display = "block";
        document.getElementById('admin-login').style.display = "none";
        document.getElementById('admin-add').style.display = "block";
        loadData();
    } else {
        alert("Mot de passe incorrect !");
    }
}

// Charger le tableau depuis Google Sheets
function loadData() {
    fetch(SCRIPT_URL)
    .then(response => response.json())
    .then(data => showInfo(data))
    .catch(err => console.error("Erreur récupération données :", err));
}

// Afficher le tableau
function showInfo(data) {
    let tableBody = document.getElementById('table-body');
    tableBody.innerHTML = "";
    data.sort((a,b) => parseInt(b.Points) - parseInt(a.Points));

    data.forEach(row => {
        let tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.Nom}</td><td>${row.Points}</td>`;
        if(isAdmin){
            tr.innerHTML += `<td>
                <button class="modify" onclick="modifierPoints('${row.Nom}')">Modifier</button>
                <button class="delete" onclick="supprimer('${row.Nom}')">Supprimer</button>
            </td>`;
        } else {
            tr.innerHTML += "<td>—</td>";
        }
        tableBody.appendChild(tr);
    });
}

// === FONCTIONS ADMIN ===
function ajouterJoueur(){
    let nom = document.getElementById('new-nom').value;
    let points = document.getElementById('new-points').value;
    if(nom && points){
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action:"ajouter", nom:nom, points:points})
        }).then(()=>{
            document.getElementById('new-nom').value = "";
            document.getElementById('new-points').value = "";
            loadData();
        });
    } else {
        alert("Merci de renseigner un nom et des points.");
    }
}

function modifierPoints(nom){
    let newPoints = prompt("Nouveaux points pour "+nom);
    if(newPoints!==null){
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action:"modifier", nom:nom, points:newPoints})
        }).then(()=>loadData());
    }
}

function supprimer(nom){
    if(confirm("Voulez-vous vraiment supprimer "+nom+" ?")){
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action:"supprimer", nom:nom})
        }).then(()=>loadData());
    }
}

// Charger tableau initial
loadData();
</script>

</body>
</html>
