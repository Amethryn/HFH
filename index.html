<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Classement Club Haikyuu</title>
<style>
body { font-family: Arial; background:#1f1f1f; color:#fff; text-align:center; padding:20px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th,td{border:1px solid #444; padding:10px;}
th{background:#f7d25a;color:#1f1f1f;}
tr:nth-child(even){background:#2a2a2a;}
</style>
</head>
<body>
<h1>Classement Club Haikyuu</h1>
<table>
<thead><tr><th>Nom</th><th>Points</th></tr></thead>
<tbody id="table-body"></tbody>
</table>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSe4aaI8DYLt9LhgMRKXbS4xP-JUI6LaS_61ZuEBqKhptpx0A4n9y5hKI6Y60UYGMx/exec";

function loadData(){
  fetch(SCRIPT_URL)
    .then(res=>res.json())
    .then(data=>{
      let tbody = document.getElementById('table-body');
      tbody.innerHTML="";
      data.sort((a,b)=>b.Points-a.Points);
      data.forEach(row=>{
        let tr=document.createElement('tr');
        tr.innerHTML=`<td>${row.Nom}</td><td>${row.Points}</td>`;
        tbody.appendChild(tr);
      });
    });
}

loadData();
</script>
<p><a href="https://script.google.com/macros/s/AKfycbwSe4aaI8DYLt9LhgMRKXbS4xP-JUI6LaS_61ZuEBqKhptpx0A4n9y5hKI6Y60UYGMx/exec?admin=true" target="_blank">Admin : ajouter / modifier joueurs</a></p>
</body>
</html>
